<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <meta name="referrer" content="no-referrer" />
    <title>Updates and Support</title>
    <style>
      body { font-family: system-ui, sans-serif; line-height: 1.5; max-width: 40rem; margin: 0 auto; padding: 1rem; }
      textarea { width: 100%; box-sizing: border-box; font: inherit; }
      .error { color: #b00020; }
      .reactions { display: flex; flex-wrap: wrap; align-items: center; gap: 0.75rem; margin: 0.5rem 0; }
      .react, .summary { position: relative; }
      .react-button { font: inherit; min-width: 44px; min-height: 44px; padding: 0 1rem; border: 1px solid #bbb; border-radius: 22px; background: #fff; }
      .react-button.mine { font-size: 1.4rem; background: #e3efff; border-color: #2563eb; }
      .tray { position: absolute; bottom: 100%; left: 0; z-index: 1; display: flex; gap: 0.15rem; padding: 0.25rem; background: #fff; border: 1px solid #ccc; border-radius: 28px; box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15); }
      .tray button { font-size: 1.6rem; min-width: 44px; min-height: 44px; padding: 0; border: 0; border-radius: 50%; background: none; }
      .tray button[aria-pressed="true"] { background: #e3efff; box-shadow: inset 0 0 0 2px #2563eb; }
      .popover { position: absolute; top: 100%; left: 0; z-index: 1; margin: 0; padding: 0.4rem 0.7rem; list-style: none; white-space: nowrap; background: #333; color: #fff; border-radius: 6px; }
      .names { margin: 0 0 0.5rem; padding: 0; list-style: none; }
      .plain { font: inherit; color: inherit; padding: 0.5rem 0; border: 0; background: none; cursor: pointer; }
      .plain:focus { outline: none; }
      .plain:focus-visible { outline: 2px solid #2563eb; outline-offset: 2px; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
